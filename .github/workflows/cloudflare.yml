name: Publish to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  recipes:
    runs-on: ubuntu-latest
    env:
      DUCKDB_VERSION: v1.5.6
    steps:
      - uses: actions/checkout@v7
      - name: Install the DuckDB CLI
        run: |
          curl -fsSL -o duckdb.zip "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip"
          mkdir -p "$RUNNER_TEMP/bin" && unzip -q duckdb.zip -d "$RUNNER_TEMP/bin" && rm duckdb.zip
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Every SQL recipe on the page must run in both dialects and agree.
      - run: python3 scripts/check-recipes.py

  deploy:
    needs: recipes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # index.md is the page in markdown; regenerate it so it matches what ships.
      - run: python3 scripts/index-md.py
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
